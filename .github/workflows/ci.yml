name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: npm test

  component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      # Exercise the oldest supported SST and its embedded Dockerfile parser.
      - run: npm install --no-save sst@4.17.1
      - name: Install the SST platform
        working-directory: tests/component/fixture
        timeout-minutes: 10
        run: ../../../node_modules/.bin/sst install
      - name: Read the tool versions selected by SST
        id: tools
        run: |
          node --input-type=commonjs -e '
            const dependencies = require("./tests/component/fixture/.sst/platform/package.json").dependencies;
            console.log("pulumi=" + dependencies["@pulumi/pulumi"].replace(/^v/, ""));
            console.log("docker-build=" + dependencies["@pulumi/docker-build"]);
          ' >> "$GITHUB_OUTPUT"
      - uses: pulumi/actions@v6
        with:
          pulumi-version: ${{ steps.tools.outputs.pulumi }}
      - name: Install the selected Docker build provider
        run: pulumi plugin install resource docker-build "${{ steps.tools.outputs.docker-build }}"
      - run: npm run test:component
      - run: npm run test:lifecycle
        env:
          PULUMI_BIN: pulumi

  # Builds the images on the current ServerSideUp tags and starts them.
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npm run test:containers
        env:
          PHP_VERSION: ${{ matrix.php }}
