name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install
      - run: npm run build
      # Pre-releases publish under their own dist-tag (0.6.0-beta.1 -> beta) so `latest` stays on the stable version
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG=${VERSION#*-}
            TAG=${TAG%%.*}
          else
            TAG=latest
          fi
          npm publish --provenance --tag "$TAG"
      # The onboarding prompt fetches docs/agent-setup.md from jsDelivr, which
      # caches the latest version for up to 12 hours. Give the registry a
      # minute to serve the new version, then clear the cache.
      - if: ${{ !contains(github.event.release.tag_name, '-') }}
        run: |
          sleep 60
          curl -fsS https://purge.jsdelivr.net/npm/@kirschbaum-development/sst-laravel/docs/agent-setup.md \
            || echo "::warning::Could not clear the jsDelivr cache of docs/agent-setup.md"
