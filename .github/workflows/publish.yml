name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install
      - run: npm run build
      # Pre-releases publish under their own dist-tag (0.6.0-beta.1 -> beta) so `latest` stays on the stable version
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG=${VERSION#*-}
            TAG=${TAG%%.*}
          else
            TAG=latest
          fi
          npm publish --provenance --tag "$TAG"
